<svg xmlns="http://www.w3.org/2000/svg" width="760" height="190" viewBox="0 0 760 190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>How each skill was tuned: run with and without, grade every check, trace each miss to the skill text, fix the skill rather than the test, run again</title>
  <defs>
    <style>
      .node { fill: none; stroke: #8b8b8b; stroke-width: 1.5; }
      .label { fill: #8b8b8b; font-size: 13px; font-weight: 600; }
      .sub { fill: #8b8b8b; font-size: 11px; }
      .path { fill: none; stroke: #8b8b8b; stroke-width: 1.5; stroke-dasharray: 5 6; animation: flow 1.6s linear infinite; }
      .back { fill: none; stroke: #8b8b8b; stroke-width: 1.5; stroke-dasharray: 5 6; animation: flow 1.6s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -22; } }
      @media (prefers-reduced-motion: reduce) { .path, .back { animation: none; } }
    </style>
  </defs>

  <rect class="node" x="20" y="48" width="150" height="64" rx="10"/>
  <text class="label" x="95" y="76" text-anchor="middle">Run twice</text>
  <text class="sub" x="95" y="94" text-anchor="middle">with the skill, without it</text>

  <path class="path" d="M172 80 H208"/>
  <polygon points="208,75 218,80 208,85" fill="#8b8b8b"/>

  <rect class="node" x="220" y="48" width="150" height="64" rx="10"/>
  <text class="label" x="295" y="76" text-anchor="middle">Grade every check</text>
  <text class="sub" x="295" y="94" text-anchor="middle">yes or no, with evidence</text>

  <path class="path" d="M372 80 H408"/>
  <polygon points="408,75 418,80 408,85" fill="#8b8b8b"/>

  <rect class="node" x="420" y="48" width="150" height="64" rx="10"/>
  <text class="label" x="495" y="76" text-anchor="middle">Trace each miss</text>
  <text class="sub" x="495" y="94" text-anchor="middle">to a line in the skill text</text>

  <path class="path" d="M572 80 H608"/>
  <polygon points="608,75 618,80 608,85" fill="#8b8b8b"/>

  <rect class="node" x="620" y="48" width="120" height="64" rx="10"/>
  <text class="label" x="680" y="76" text-anchor="middle">Fix the skill</text>
  <text class="sub" x="680" y="94" text-anchor="middle">never the test</text>

  <path class="back" d="M680 114 V150 H95 V116"/>
  <polygon points="90,118 95,108 100,118" fill="#8b8b8b"/>
  <text class="sub" x="388" y="166" text-anchor="middle">and run again. Three rounds for the principal skill, three for localization, five for the README writer, two for break-the-template.</text>
</svg>
