<svg xmlns="http://www.w3.org/2000/svg" width="760" height="304" viewBox="0 0 760 304" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Checks passed with and without each skill, same tasks, same model</title>
  <rect width="760" height="304" rx="12" fill="#0d1117" stroke="#30363d"/>
  <text x="28" y="36" font-size="13" font-weight="600" fill="#8b949e" letter-spacing="1">CHECKS PASSED, SAME TASKS, SAME MODEL</text>
  <g font-size="11" fill="#8b949e">
    <rect x="560" y="26" width="10" height="10" rx="2" fill="#484f58"/><text x="576" y="35.5">without the skill</text>
    <rect x="664" y="26" width="10" height="10" rx="2" fill="#f0f6fc"/><text x="680" y="35.5">with the skill</text>
  </g>
  <g font-size="14" fill="#f0f6fc">
    <text x="28" y="80">principal-apple-engineer</text>
    <text x="28" y="98" font-size="11" fill="#8b949e">42 checks, 3 tasks, 3 rounds</text>
    <rect x="236" y="66" width="0" height="10" rx="3" fill="#484f58"><animate attributeName="width" from="0" to="320" dur="0.9s" begin="0.2s" fill="freeze"/></rect>
    <rect x="236" y="80" width="0" height="10" rx="3" fill="#f0f6fc"><animate attributeName="width" from="0" to="410" dur="0.9s" begin="0.5s" fill="freeze"/></rect>
    <text x="664" y="76" font-size="12" fill="#8b949e">32 of 42</text>
    <text x="664" y="90" font-size="12" font-weight="600">41 of 42</text>

    <text x="28" y="142">localization-professional</text>
    <text x="28" y="160" font-size="11" fill="#8b949e">25 checks, 3 tasks, after 4 fixes</text>
    <rect x="236" y="128" width="0" height="10" rx="3" fill="#484f58"><animate attributeName="width" from="0" to="286" dur="0.9s" begin="0.35s" fill="freeze"/></rect>
    <rect x="236" y="142" width="0" height="10" rx="3" fill="#f0f6fc"><animate attributeName="width" from="0" to="420" dur="0.9s" begin="0.65s" fill="freeze"/></rect>
    <text x="664" y="138" font-size="12" fill="#8b949e">17 of 25</text>
    <text x="664" y="152" font-size="12" font-weight="600">25 of 25</text>

    <text x="28" y="204">readme-writer</text>
    <text x="28" y="222" font-size="11" fill="#8b949e">36 checks, 3 READMEs, agent-graded</text>
    <rect x="236" y="190" width="0" height="10" rx="3" fill="#484f58"><animate attributeName="width" from="0" to="105" dur="0.9s" begin="0.5s" fill="freeze"/></rect>
    <rect x="236" y="204" width="0" height="10" rx="3" fill="#f0f6fc"><animate attributeName="width" from="0" to="373" dur="0.9s" begin="0.8s" fill="freeze"/></rect>
    <text x="664" y="200" font-size="12" fill="#8b949e">9 of 36</text>
    <text x="664" y="214" font-size="12" font-weight="600">32 of 36</text>

    <text x="28" y="266">break-the-template</text>
    <text x="28" y="284" font-size="11" fill="#8b949e">18 checks, 3 briefs, plus 48 facts audited</text>
    <rect x="236" y="252" width="0" height="10" rx="3" fill="#484f58"><animate attributeName="width" from="0" to="210" dur="0.9s" begin="0.65s" fill="freeze"/></rect>
    <rect x="236" y="266" width="0" height="10" rx="3" fill="#f0f6fc"><animate attributeName="width" from="0" to="420" dur="0.9s" begin="0.95s" fill="freeze"/></rect>
    <text x="664" y="262" font-size="12" fill="#8b949e">9 of 18</text>
    <text x="664" y="276" font-size="12" font-weight="600">18 of 18</text>
  </g>
</svg>
